<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InudQue — Selamat Pagi & Blue Mood 💙</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent:#FF6B9A;
      --muted:#6b6b6b;
    }
    body{
      margin:0;
      font-family:"Poppins",sans-serif;
      background:radial-gradient(circle at 10% 10%, #FFF7FB 0%, #FFF1F5 40%, #FFEFEF 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      min-height:100vh;
    }
    .card{
      width:100%;
      max-width:760px;
      background:white;
      padding:28px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 12px 30px rgba(255,107,154,0.12);
    }
    h1{
      font-family:"Pacifico",cursive;
      color:var(--accent);
      margin:6px 0;
      font-size:40px;
    }
    .name-badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:#FFF0F6;
      color:#ff2e72;
      font-weight:700;
      margin-bottom:12px;
    }
    textarea{
      width:100%;
      max-width:640px;
      min-height:120px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.06);
      padding:12px;
      margin-top:12px;
      resize:vertical;
      font-size:16px;
    }
    .actions{
      display:flex;
      gap:10px;
      justify-content:center;
      margin-top:14px;
      flex-wrap:wrap;
    }
    .btn{
      padding:12px 18px;
      border-radius:12px;
      border:0;
      cursor:pointer;
      font-weight:700;
      background:linear-gradient(90deg,var(--accent),#ff8db3);
      color:white;
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
    }
    .secondary{ background:white; color:var(--accent); border:1px solid #ffc3d9; }
    .audio-box{
      margin-top:20px;
      padding:12px;
      background:#fff6fa;
      border-radius:12px;
      border:1px dashed #ffbdd5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Good Morning, Bebeb 🌞</h1>
    <div class="name-badge">InudQue 💕</div>

    <p style="color:#444;margin-bottom:12px;">
      Ada lagu buat kamu biar paginya makin sweet 💙
    </p>

    <!-- MUSIC PLAYER -->
    <div class="audio-box">
      <p style="margin:0 0 8px;font-weight:600;color:#333;">puter musik</p>

      <!-- Autoplay Audio -->
      <audio id="bgm" src="https://feeldreams.github.io/audio/foreveryoung.mp3" autoplay loop></audio>

      <!-- Backup Play Button if autoplay blocked -->
      <button id="playBtn" class="btn secondary" style="margin-top:8px;">▶ Play Music</button>
    </div>

    <div class="message" style="
      margin:20px auto;
      max-width:640px;
      padding:14px;
      border-radius:10px;
      border:1px dashed rgba(255,107,154,0.15);
      background:white;">
      Hai <strong>Inud</strong> 💗,<br>
      Selamat pagi, semoga harimu manis kaya lagu yang lagi nyala sekarang.  
      Jangan lupa senyum ya, biar dunia juga ikut cerah 💕🌞
    </div>

    <label style="font-weight:600;color:#444;">Ketik balasan manismu:</label>
    <textarea id="replyArea">Hai sayang, makasih ya udah kirim hal manis. Aku sayang kamu 💕</textarea>

    <div class="actions">
      <button class="btn" id="sendWa">Kirim ke WhatsApp Rizky</button>
      <button class="btn secondary" id="copyBtn">Copy Pesan</button>
    </div>
  </div>

  <script>
    const targetNumber = "6282114633587";
    const sendBtn = document.getElementById('sendWa');
    const replyArea = document.getElementById('replyArea');
    const copyBtn = document.getElementById('copyBtn');

    function openWA(msg){
      const t = encodeURIComponent(msg);
      window.open(`https://wa.me/${targetNumber}?text=${t}`, "_blank");
    }

    sendBtn.onclick = () => {
      const t = replyArea.value.trim();
      if(!t) return alert("Isi dulu pesannya ya 💌");
      openWA(t);
    };

    copyBtn.onclick = async () => {
      try{
        await navigator.clipboard.writeText(replyArea.value);
        copyBtn.textContent="Tersalin! ✓";
        setTimeout(()=>copyBtn.textContent="Copy Pesan",2000);
      }catch(e){ alert("Gagal nyalin otomatis."); }
    };

    // Music autoplay fallback
    const bgm = document.getElementById('bgm');
    const playBtn = document.getElementById('playBtn');
    playBtn.onclick = () => bgm.play();
  </script>
</body>
</html>
